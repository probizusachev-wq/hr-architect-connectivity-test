</style></head><body><main><header class="brand"><b>HR ARCHITECT AI™</b><span class="tag">RESERVE · GOOGLE</span></header><div id="app"></div></main><script>
const API="https://script.google.com/macros/s/AKfycbxyBECppP8ukhdeuFmnICrLbIbljNLoYm6CPDhRxjaEFgDaGwQWys2K1PctGUhq4UKk/exec";const Q=(id,domain,theme,text,options)=>({id,domain,theme,text,options});const QUESTIONS=[]=[
Q('S1','strategic','Формирование HR-повестки','Как формируется HR-повестка компании на год?',['Повестки как таковой нет: HR реагирует на текущие запросы подразделений.','Повестка формируется как перечень кадровых мероприятий и бюджета найма.','Повестка составляется HR-функцией и согласуется с руководством постфактум.','Повестка выводится из бизнес-целей года и защищается перед менеджментом.','Повестка строится от бизнес-стратегии, с приоритизацией по влиянию на результат.','Повестка HR — часть стратегической архитектуры компании и пересматривается по сценариям бизнеса.']),
Q('S2','strategic','Момент входа HR в решения','На каком этапе HR подключается к значимым бизнес-решениям (запуск нового направления, слияние или поглощение, сокращение численности, автоматизация)?',['Не подключается: узнаёт о решении после его принятия.','Подключается на этапе исполнения — оформить и нанять.','Подключается ближе к финалу, чтобы оценить кадровые риски.','Участвует в обсуждении вариантов до принятия решения.','Участвует с самого начала и приносит расчёты по людям и стоимости труда.','Является соавтором решения: без организационно-экономической модели HR решение не принимается.']),
Q('S3','strategic','Измерение ценности HR','Как измеряется ценность HR-функции для бизнеса?',['Не измеряется никак.','По объёму выполненной работы: закрытые вакансии, обучения, мероприятия.','По операционным HR-метрикам: текучесть, срок закрытия, вовлечённость.','По вкладу HR-инициатив в цели подразделений.','По измеримому эффекту на производительность и стоимость труда.','По влиянию на экономику компании: выручка на сотрудника, ROI решений, устойчивость структуры.']),
Q('S4','strategic','Планирование будущей рабочей силы','Как компания планирует потребность в людях и компетенциях на горизонте 2–3 лет?',['Не планирует: нанимаем, когда возникает нехватка.','Планирование только на год, по заявкам руководителей.','Есть план численности, но без компетенций и сценариев.','Прогноз численности и ключевых компетенций по бизнес-плану.','Сценарное планирование рабочей силы с учётом технологий и рынка труда.','Стратегическое планирование рабочей силы: сценарии спроса, дефицита, автоматизации и стоимости труда.']),
Q('S5','strategic','Роль HRD для CEO','Какую роль HR-директор реально выполняет для первого лица компании?',['Административный ресурс: кадры, документы, дисциплина.','Исполнитель кадровых задач по поручениям.','Сервисный партнёр по подбору и обучению.','Советник по вопросам людей и климата в командах.','Партнёр по управленческим решениям с опорой на данные.','Архитектор организации: проектирует структуру, работу и экономику труда вместе с CEO.']),
Q('W1','work','Обоснование численности','На каком основании определяется необходимая численность персонала?',['На основании субъективных запросов руководителей.','От прошлогодней численности плюс прирост.','По утверждённому штатному расписанию и бюджету.','По нормативам нагрузки в отдельных функциях.','По объёму работы, производительности и целевым показателям.','По модели спроса на работу с учётом автоматизации, AI и внешнего таланта.']),
Q('W2','work','Проектирование ролей','Как проектируются роли и должности?',['Роли складываются стихийно вокруг конкретных людей.','Должностные инструкции формальны и не отражают реальную работу.','Роли описаны, но пересматриваются редко и несистемно.','Роли описаны через зоны ответственности и результаты.','Роли проектируются от задач и создаваемой ценности, регулярно пересматриваются.','Роли — производная архитектуры работы: набор задач, распределённых между людьми, системами и AI.']),
Q('W3','work','Работа, создающая ценность','Понимает ли компания, какая доля работы реально создаёт ценность?',['Такой вопрос не ставится.','Есть ощущение, что много лишнего, но без фактов.','Точечные наблюдения в отдельных подразделениях.','Проводился анализ процессов и трудозатрат в ключевых функциях.','Регулярно оценивается структура задач: ценность, поддержка, потери.','Работа разложена на задачи с оценкой ценности и стоимости; потери устраняются системно.']),
Q('W4','work','Редизайн после технологий','Что происходит с работой после внедрения новых технологий или систем?',['Ничего: люди работают как раньше плюс новая система.','Иногда убираются очевидно устаревшие операции.','Процессы обновляются, роли — нет.','Роли корректируются в затронутых подразделениях.','Редизайн работы — обязательный этап внедрения технологии.','Технология и архитектура работы проектируются одновременно, с пересчётом численности и экономики.']),
Q('W5','work','Интегрированная рабочая сила','Как управляется совокупная рабочая сила: штат, автоматизация, AI, внешний талант?',['Управляется только штат, остальное — вне поля HR.','Подрядчики и аутсорс учитываются отдельно от HR-планирования.','Есть понимание разных источников труда, но без единой модели.','Штат и внешний талант планируются совместно.','Модель включает людей, автоматизацию и внешний талант.','Единая модель Человек + AI + автоматизация + внешний талант с общей экономикой и распределением задач.']),
Q('E1','economics','Управление ФОТ','Как управляется фонд оплаты труда?',['ФОТ фиксируется по факту, управление отсутствует.','ФОТ ограничивается бюджетом и индексируется.','ФОТ контролируется по подразделениям и отклонениям.','ФОТ планируется от целей по численности и рынку труда.','ФОТ управляется как инвестиция: связка с результатом подразделений.','ФОТ управляется через архитектуру работы: структура затрат труда моделируется и оптимизируется.']),
Q('E2','economics','Полная стоимость труда','Знает ли компания полную стоимость труда (не только оклады)?',['Нет, известен только ФОТ.','ФОТ и налоги.','ФОТ, налоги и часть льгот.','Полная стоимость по компании, но без разреза по ролям.','Полная стоимость труда по функциям и ролям, включая потери от текучести.','Полная экономика труда: стоимость роли, задачи и единицы результата.']),
Q('E3','economics','Связь стоимости и производительности','Насколько прозрачна связь между стоимостью труда и производительностью?',['Связь не рассматривается.','Обсуждается интуитивно при сокращении расходов.','Сравниваются ФОТ и выручка на уровне компании.','Анализируется по ключевым подразделениям.','Регулярный анализ по функциям с выводами для решений.','Экономика труда моделируется: изменение структуры работы пересчитывается в результат и затраты.']),
Q('E4','economics','Экономический эффект HR-решений','Оценивается ли экономический эффект HR-решений (найм, обучение, реорганизация, удержание)?',['Нет.','Только затраты на мероприятие.','Затраты и качественные результаты.','Эффект оценивается для крупных инициатив.','Эффект оценивается до и после для большинства решений.','Каждое значимое решение проходит через бизнес-кейс с расчётом эффекта и рисков.']),
Q('E5','economics','Диалог с CEO об экономике людей','Может ли HR объяснить первому лицу экономику человеческого капитала на языке финансов?',['Нет, разговор идёт в кадровых терминах.','Только на уровне бюджета и численности.','Частично: отдельные метрики и сравнения.','Да, по ключевым темам с опорой на данные.','Да, с расчётами эффекта и альтернатив.','Да: HR приносит экономические сценарии, на которых строятся решения совета директоров.']),
Q('P1','productivity','Измерение производительности','Как измеряется производительность труда в компании?',['Не измеряется.','Косвенно: по выполнению планов и загруженности.','Выручка на сотрудника по компании в целом.','Показатели производительности по ключевым функциям.','Система показателей по подразделениям с динамикой.','Производительность измеряется на уровне процессов и ролей и связана с экономикой труда.']),
Q('P2','productivity','Объяснение падения','Если производительность снижается, может ли компания объяснить причину?',['Снижение обычно замечают поздно и объясняют внешними факторами.','Объяснение строится на мнениях руководителей.','Есть частичные данные, выводы спорные.','Причины разбираются по данным ключевых процессов.','Причины декомпозируются: структура, нагрузка, качество, компетенции.','Есть аналитическая модель факторов производительности с проверяемыми гипотезами.']),
Q('P3','productivity','Организационные потери','Видит ли компания организационные потери — переделки, согласования, простои, дублирование?',['Не видит и не обсуждает.','Обсуждает как жалобы сотрудников.','Отдельные кейсы фиксируются вручную.','Потери выявляются в проектах улучшений.','Потери регулярно оцениваются в ключевых процессах.','Потери количественно оценены в деньгах и включены в управленческую отчётность.']),
Q('P4','productivity','HR-метрики и результат бизнеса','Связаны ли HR-метрики с показателями результативности бизнеса?',['HR-метрики существуют отдельно от бизнес-показателей.','Сопоставление делается изредка и вручную.','Часть метрик сопоставляется с бизнес-результатом.','Ключевые HR-метрики привязаны к целям подразделений.','Существует связанная система HR- и бизнес-показателей.','Причинно-следственные связи проверяются данными и используются в решениях.']),
Q('P5','productivity','Производительность в расчёте численности','Используется ли производительность при определении численности?',['Нет, численность определяется отдельно.','Учитывается интуитивно.','Учитывается при сокращении затрат.','Используется в отдельных функциях.','Используется системно при планировании численности.','Численность выводится из модели производительности и объёма работы.']),
Q('O1','orgarch','Проектирование структуры','Как проектируется организационная структура?',['Складывается исторически и под конкретных людей.','Меняется реактивно при появлении проблем.','Пересматривается при крупных изменениях бизнеса.','Проектируется от функций и зон ответственности.','Проектируется от процессов и потоков создания ценности.','Проектируется как архитектура: потоки работы, решения, нагрузка и стоимость структуры.']),
Q('O2','orgarch','Уровни управления','Управляет ли компания количеством уровней управления?',['Количество уровней никто не отслеживает.','Известно приблизительно.','Уровни зафиксированы, но не анализируются.','Уровни контролируются при изменениях структуры.','Есть целевые принципы по уровням и они соблюдаются.','Уровни управления — управляемый параметр архитектуры со связью со скоростью решений.']),
Q('O3','orgarch','Норма управляемости','Управляется ли норма управляемости — количество сотрудников в прямом подчинении одного руководителя?',['Не измеряется.','Известна выборочно.','Измеряется, но без целевых значений.','Есть целевые диапазоны для части подразделений.','Целевые диапазоны установлены и контролируются по компании.','Норма управляемости моделируется по типу работы и связана со стоимостью управления.']),
Q('O4','orgarch','Дублирование и узкие места решений','Выявляются ли дублирование функций и узкие места в принятии решений?',['Нет, проблемы всплывают спонтанно.','Обсуждаются на уровне ощущений.','Выявляются точечно при конфликтах.','Периодически проводится ревизия функций.','Дублирование и узлы решений анализируются регулярно.','Карта решений и ответственности поддерживается и используется при редизайне структуры.']),
Q('O5','orgarch','Сценарное моделирование реорганизации','Моделируются ли сценарии до проведения реорганизации?',['Решения принимаются без моделирования.','Оценивается только экономия на ФОТ.','Рассматривается один вариант структуры.','Сравниваются несколько вариантов качественно.','Сценарии сравниваются по стоимости, нагрузке и рискам.','Полноценное моделирование: структура, численность, экономика, скорость решений и риски исполнения.']),
Q('D1','data','Интеграция данных','Насколько интегрированы данные о персонале?',['Данные разрознены, много ручного сбора в таблицах.','Есть кадровая система, остальное вручную.','Несколько систем без интеграции.','Ключевые источники интегрированы в единую отчётность.','Единая модель HR-данных с контролем качества.','Единая платформа данных о людях, работе и затратах, доступная для анализа.']),
Q('D2','data','HR и финансовые данные','Соединяются ли HR-данные с финансовыми?',['Нет.','Только на уровне бюджета ФОТ.','Сопоставляются вручную к отчётным датам.','Регулярная совместная отчётность HR и финансов.','Единая аналитика затрат на труд и результата.','Интегрированная модель экономики персонала, используемая в управленческих решениях.']),
Q('D3','data','Предиктивная аналитика','Используется ли предиктивная аналитика (риски ухода, дефицит компетенций, нагрузка)?',['Нет.','Обсуждается как идея.','Пилоты без применения в решениях.','Отдельные предиктивные модели в работе.','Прогнозы используются в планировании персонала.','Прогнозная аналитика встроена в управленческий цикл и оценивается по точности.']),
Q('D4','data','Управленческая видимость','Какую картину по людям видит менеджмент?',['Практически ничего, кроме численности.','Базовые кадровые отчёты по запросу.','Регулярные отчёты с историческими данными.','Дашборды по ключевым показателям.','Дашборды с разрезами по подразделениям и динамикой.','Управленческая панель: люди, работа, производительность и стоимость труда в одном контуре.']),
Q('D5','data','Аналитика для решений','Для чего фактически используется HR-аналитика?',['Не используется.','Для отчётности перед руководством.','Для объяснения уже произошедшего.','Для постановки задач HR-функции.','Для подготовки управленческих решений.','Для проектирования решений и проверки их эффекта после внедрения.']),
Q('A1','ai','Системность внедрения AI','Насколько системно компания внедряет AI в работу?',['AI не используется.','Отдельные сотрудники используют AI по своей инициативе.','Есть разрозненные пилоты без общей логики.','Определены приоритетные направления применения AI.','Есть программа внедрения AI с приоритетами и ответственными.','AI встроен в архитектуру работы: применение определяется ценностью и экономикой задач.']),
Q('A2','ai','Распределение задач между человеком и AI','Как принимается решение, какие задачи передаются AI?',['Такое решение не принимается.','По желанию отдельных руководителей.','По удобству и доступности инструментов.','По списку типовых задач, согласованному с функциями.','По анализу задач: повторяемость, риск, качество, стоимость.','Через модель распределения задач Человек + AI с пересчётом ролей и результата.']),
Q('A3','ai','Редизайн ролей под AI','Что происходит с ролями после внедрения AI?',['Роли не меняются.','Сотрудники сами адаптируются.','Меняются отдельные обязанности.','Роли обновляются в затронутых функциях.','Роли системно перепроектируются под новое распределение задач.','Роли, компетенции и численность пересобираются как часть архитектуры работы.']),
Q('A4','ai','Экономический эффект AI','Измеряется ли экономический эффект от применения AI?',['Нет.','Оцениваются только затраты на инструменты.','Эффект описывается качественно.','Эффект измеряется в отдельных пилотах.','Эффект измеряется по большинству инициатив.','Эффект AI измеряется в высвобожденном времени, качестве и стоимости труда и попадает в экономику компании.']),
Q('A5','ai','Стратегия Человек + AI','Есть ли у компании стратегия рабочей силы Человек + AI?',['Нет и не обсуждается.','Обсуждается на уровне намерений.','Есть отдельные тезисы в ИТ-стратегии.','Есть направление, закреплённое за функцией.','Есть сформулированная стратегия с горизонтом и метриками.','Стратегия Человек + AI интегрирована со стратегией бизнеса и моделью численности.']),
Q('T1','transformation','Целевая операционная модель HR','Определена ли целевая операционная модель HR-функции?',['Нет, функция работает как сложилось.','Есть общее понимание без описания.','Описана структура HR, но не модель работы.','Определены сервисы, роли и уровни поддержки.','Целевая модель описана и внедряется по плану.','Целевая модель спроектирована от бизнес-задач: сервисы, данные, технологии, компетенции, экономика.']),
Q('T2','transformation','Будущие компетенции HR','Определены ли компетенции, необходимые HR-функции в будущем?',['Нет.','Обсуждаются в общих словах.','Определены только классические HR-компетенции.','Определены аналитические и продуктовые компетенции.','Есть целевой профиль команды и план развития.','Целевые компетенции (аналитика, экономика труда, AI, орг-дизайн) выстроены и развиваются системно.']),
Q('T3','transformation','Дорожная карта трансформации','Существует ли дорожная карта трансформации HR?',['Нет.','Есть список пожеланий.','Есть годовой план инициатив.','Есть карта с этапами и ответственными.','Есть карта с этапами, ресурсами и зависимостями.','Карта построена по архитектурным приоритетам и пересматривается по результатам замеров.']),
Q('T4','transformation','Измерение трансформации','Как измеряется прогресс трансформации HR?',['Не измеряется.','По факту выполнения задач.','По внедрённым инструментам и системам.','По KPI HR-функции.','По эффекту на бизнес-показатели.','По изменению зрелости архитектуры: работа, структура, данные, экономика труда.']),
Q('T5','transformation','Связь с трансформацией бизнеса','Насколько трансформация HR связана с трансформацией бизнеса?',['Не связана, это внутренняя история HR.','Связана декларативно.','Связана через отдельные проекты.','Синхронизирована по срокам и приоритетам.','Является частью программы изменений компании.','HR-трансформация — несущий элемент трансформации бизнес-модели компании.'])
];
const DOMAINS=[['strategic','Стратегическая роль HR'],['work','Архитектура работы'],['economics','Экономика человеческого капитала'],['productivity','Производительность'],['orgarch','Архитектура организации'],['data','Данные и аналитика HR'],['ai','Человек + AI'],['transformation','Архитектура трансформации HR']];
const LEVEL=n=>n<60?'HR-ОПЕРАТОР':n<110?'HR-БИЗНЕС-ПАРТНЁР':n<160?'HR-СТРАТЕГ':'HR-АРХИТЕКТОР';
let state={view:'home',idx:0,answers:{},id:'',participant:{name:'',email:'',contact:'',consent:false},profile:{company:'',role:'',industry:'',headcount:'',hrTeam:''}};
try{const x=JSON.parse(localStorage.getItem('hr-architect-reserve-v1')||'null');if(x&&x.view)state=x}catch{}
const app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem('hr-architect-reserve-v1',JSON.stringify(state))}
function scores(){const s=Object.fromEntries(DOMAINS.map(d=>[d[0],0]));QUESTIONS.forEach(q=>{if(Number.isInteger(state.answers[q.id]))s[q.domain]+=state.answers[q.id]});return s}
function payload(status){const s=scores(),n=Object.values(s).reduce((a,b)=>a+b,0);return{id:state.id,status,answered:Object.keys(state.answers).length,...state.participant,...state.profile,answers:state.answers,result:status==='completed'?{index:n,level:LEVEL(n),domains:DOMAINS.map(d=>({name:d[1],score:s[d[0]],max:25}))}:{}}}
async function sync(status){save();try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(status))});return true}catch(e){return false}}
function render(){save();if(state.view==='home'){app.innerHTML='<section class="card"><div class="ey">ЦИФРОВАЯ ДИАГНОСТИКА HR-ФУНКЦИИ</div><h1>Архитектура HR<br>в индексе 200</h1><p>40 вопросов · 8 направлений · персональный результат. Резервный контур диагностики HR ARCHITECT AI™.</p><div class="notice">Beta-версия методологии. Диагностический инструмент не является финансовой оценкой потерь.</div><br><button class="primary" id="start">НАЧАТЬ ДИАГНОСТИКУ →</button></section>';document.getElementById('start').onclick=()=>{state.view='profile';render()};return}
if(state.view==='profile'){app.innerHTML='<section class="card"><div class="ey">ПРОФИЛЬ УЧАСТНИКА</div><h2>Перед началом диагностики</h2><div class="grid">'+field('company','Компания')+field('role','Ваша роль')+field('industry','Отрасль')+field('headcount','Численность компании')+field('hrTeam','Размер HR-команды')+fieldP('name','Имя')+fieldP('email','Рабочий e-mail','email')+fieldP('contact','Telegram или телефон')+'</div><label class="consent"><input id="consent" type="checkbox" '+(state.participant.consent?'checked':'')+'><span>Согласен(на) на обработку указанных контактных данных, сохранение прогресса и результатов диагностики командой HR ARCHITECT AI™ и связь со мной по указанным каналам.</span></label><button class="primary" id="go">К ДИАГНОСТИКЕ →</button></section>';bindFields();document.getElementById('consent').onchange=e=>{state.participant.consent=e.target.checked;save()};document.getElementById('go').onclick=async()=>{const p=state.participant,x=state.profile;if(!p.name.trim()||!p.email.includes('@')||!p.contact.trim()||!p.consent||Object.values(x).some(v=>!String(v).trim()))return alert('Заполните все поля и подтвердите согласие.');state.id=state.id||crypto.randomUUID();state.view='assessment';await sync('started');render()};return}
if(state.view==='assessment'){const q=QUESTIONS[state.idx],done=Object.keys(state.answers).length,d=DOMAINS.find(x=>x[0]===q.domain);app.innerHTML='<section class="card"><div class="topline"><span>'+esc(d[1])+'</span><span>ВОПРОС '+(state.idx+1)+' / '+QUESTIONS.length+'</span></div><div class="progress"><i style="width:'+(done/QUESTIONS.length*100)+'%"></i></div><div class="ey">'+esc(q.theme)+'</div><h2>'+esc(q.text)+'</h2><div class="options">'+q.options.map((o,i)=>'<button data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b>'+esc(o)+'</button>').join('')+'</div><div class="actions"><button id="back" '+(state.idx===0?'disabled':'')+'>← НАЗАД</button><span class="muted">Заполнено '+done+'/40</span></div></section>';document.querySelectorAll('.options button').forEach(b=>b.onclick=async()=>{state.answers[q.id]=Number(b.dataset.i);const n=Object.keys(state.answers).length;if(n===QUESTIONS.length){state.view='results';await sync('completed')}else{let j=state.idx+1;if(j>=QUESTIONS.length||Number.isInteger(state.answers[QUESTIONS[j].id])){j=QUESTIONS.findIndex(x=>!Number.isInteger(state.answers[x.id]));if(j<0)j=QUESTIONS.length-1}state.idx=j;await sync('started')}render()});document.getElementById('back').onclick=()=>{if(state.idx>0){state.idx--;render()}};return}
if(state.view==='results'){const s=scores(),n=Object.values(s).reduce((a,b)=>a+b,0),weak=[...DOMAINS].sort((a,b)=>s[a[0]]-s[b[0]]).slice(0,3);app.innerHTML='<section class="card"><div class="ey">РЕЗУЛЬТАТ ДИАГНОСТИКИ</div><h1>'+n+'<small style="font-size:.35em;color:var(--muted)"> / 200</small></h1><h2>'+LEVEL(n)+'</h2><p>Три направления, требующие первоочередного внимания: <b>'+weak.map(x=>esc(x[1])).join(' · ')+'</b>.</p><div class="domains">'+DOMAINS.map(d=>'<div class="domain"><span>'+esc(d[1])+'</span><b>'+s[d[0]]+'/25</b></div>').join('')+'</div><p class="notice">Диагностические сигналы требуют экспертной верификации на данных компании. Экономические эффекты не являются оценкой финансовых потерь.</p><div class="actions"><button id="again">НОВАЯ ДИАГНОСТИКА</button></div></section>';document.getElementById('again').onclick=()=>{localStorage.removeItem('hr-architect-reserve-v1');state={view:'home',idx:0,answers:{},id:'',participant:{name:'',email:'',contact:'',consent:false},profile:{company:'',role:'',industry:'',headcount:'',hrTeam:''}};render()}}
function field(k,l){return '<label class="field">'+l+'<input data-p="'+k+'" value="'+esc(state.profile[k])+'"></label>'}function fieldP(k,l,t='text'){return '<label class="field">'+l+'<input type="'+t+'" data-u="'+k+'" value="'+esc(state.participant[k])+'"></label>'}function bindFields(){document.querySelectorAll('[data-p]').forEach(x=>x.oninput=e=>{state.profile[x.dataset.p]=e.target.value;save()});document.querySelectorAll('[data-u]').forEach(x=>x.oninput=e=>{state.participant[x.dataset.u]=e.target.value;save()})}render();
</script></body></html>
