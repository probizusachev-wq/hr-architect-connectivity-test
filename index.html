<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Architect — Connectivity Test</title>
<style>
body{margin:0;background:#0b0d10;color:#f4f1e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center}
main{max-width:720px;margin:24px;padding:36px;border:1px solid #34383e;border-radius:18px;background:#12151a}
.ok{color:#d6b66b;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(28px,6vw,48px);margin:.3em 0}.muted{color:#aeb4bd;line-height:1.6}
button{margin-top:18px;padding:14px 18px;border:1px solid #d6b66b;border-radius:10px;background:transparent;color:#f4f1e8;font-weight:800;cursor:pointer}
#status{margin-top:16px;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body><main>
<div class="ok">CONNECTIVITY TEST · OK</div>
<h1>HR ARCHITECT AI™</h1>
<p>Если вы видите эту страницу, независимый тестовый сайт GitHub Pages открывается на вашем устройстве.</p>
<p class="muted">Это отдельный тестовый репозиторий. Рабочий HR ARCHITECT AI™ и его Cloudflare-конфигурация не изменялись.</p>
<button id="writeTest">ПРОВЕРИТЬ ЗАПИСЬ В БАЗУ</button>
<div id="status" class="muted">Тест записи ещё не запускался.</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxyBECppP8ukhdeuFmnICrLbIbljNLoYm6CPDhRxjaEFgDaGwQWys2K1PctGUhq4UKk/exec';
document.getElementById('writeTest').addEventListener('click',async()=>{
 const b=document.getElementById('writeTest'),s=document.getElementById('status');
 b.disabled=true;s.textContent='Отправляем безопасную тестовую запись…';
 const id='github-pages-test-'+Date.now();
 const payload={id,status:'started',answered:1,name:'TEST',email:'test@example.com',contact:'TEST',company:'HR ARCHITECT RESERVE TEST',role:'TEST',industry:'TEST',headcount:'TEST',hrTeam:'TEST',consent:true,answers:{test:true},result:{}};
 try{
   await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
   s.textContent='TEST ОТПРАВЛЕН · ID: '+id+'\nТеперь проверяем строку в Google Sheets.';
 }catch(e){s.textContent='ОШИБКА ОТПРАВКИ · '+String(e)}
 finally{b.disabled=false}
});
</script>
</main></body></html>
